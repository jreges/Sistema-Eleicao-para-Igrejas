<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eleição de Oficiais da Igreja</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg,#f0ede6);color:var(--tx,#1a1a18);min-height:100vh}
input,select,textarea,button{font-family:inherit}
button{cursor:pointer}
.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.wrap{width:100%;max-width:380px}
.container{width:100%;max-width:760px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px;margin-bottom:12px}
.card-sm{background:#fff;border:1px solid #eee;border-radius:10px;padding:10px 14px}
.field{margin-bottom:12px}
.field label{font-size:12px;color:#666;display:block;margin-bottom:4px;font-weight:600}
.input{width:100%;padding:9px 12px;border-radius:8px;border:1px solid #ccc;background:#fff;color:#1a1a18;font-size:14px;outline:none;transition:border-color .15s}
.input:focus{border-color:var(--p,#185FA5);box-shadow:0 0 0 3px rgba(24,95,165,.07)}
select.input{cursor:pointer}
textarea.input{resize:vertical}
.cpf-ok{border-color:#3B6D11!important}
.cpf-err{border-color:#a32d2d!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;border:1px solid #ccc;background:#f5f5f5;color:#333;transition:all .15s;white-space:nowrap;cursor:pointer}
.btn:hover{filter:brightness(.95)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
.btn-full{width:100%;padding:10px;justify-content:center}
.btn-p{background:var(--pbg,#e6f1fb);color:var(--p,#185FA5);border-color:var(--p,#185FA5)}
.btn-s{background:var(--sbg,#eaf3de);color:var(--s,#3B6D11);border-color:var(--s,#3B6D11)}
.btn-danger{background:#fcebeb;color:#a32d2d;border-color:#a32d2d}
.btn-warn{background:#faeeda;color:#854F0B;border-color:#854F0B}
.btn-sm{padding:4px 9px;font-size:12px}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:6px}
.bdg-ok{background:#eaf3de;color:#3B6D11}
.bdg-err{background:#fcebeb;color:#a32d2d}
.bdg-warn{background:#faeeda;color:#854F0B}
.bdg-gray{background:#eee;color:#666}
.bdg-info{background:var(--pbg,#e6f1fb);color:var(--p,#185FA5)}
.divider{height:1px;background:#eee;margin:14px 0}
.err-box{background:#fcebeb;color:#a32d2d;font-size:12px;padding:8px 12px;border-radius:8px;margin-bottom:10px}
.info-box{background:var(--pbg,#e6f1fb);color:var(--p,#185FA5);font-size:12px;padding:8px 12px;border-radius:8px;margin-bottom:10px}
.warn-box{background:#faeeda;color:#854F0B;font-size:12px;padding:8px 12px;border-radius:8px;margin-bottom:10px}
.succ-box{background:#eaf3de;color:#3B6D11;font-size:12px;padding:8px 12px;border-radius:8px;margin-bottom:10px}
.tabs{background:#fff;border-bottom:1px solid #ddd;display:flex;overflow-x:auto;padding:0 8px}
.tabs::-webkit-scrollbar{height:0}
.tab-btn{padding:10px 12px;font-size:13px;background:transparent;border:none;border-bottom:2px solid transparent;color:#888;font-weight:400;white-space:nowrap;cursor:pointer;transition:all .15s}
.tab-btn.active{color:var(--p,#185FA5);font-weight:700;border-bottom-color:var(--p,#185FA5)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:9999;white-space:nowrap;animation:tIn .25s ease;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.12)}
@keyframes tIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:1000}
.topbar{background:#fff;border-bottom:1px solid #ddd;padding:10px 16px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:100}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat-card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px 14px}
.stat-card .lbl{font-size:11px;color:#888;margin-bottom:2px}
.stat-card .val{font-size:26px;font-weight:700}
.pres-item{display:flex;align-items:center;gap:10px;border-radius:10px;padding:9px 13px;margin-bottom:6px;cursor:pointer;transition:all .15s;border:1px solid #ddd;background:#fff}
.pres-item.p{background:#eaf3de;border-color:#3B6D11}
.spinner{width:24px;height:24px;border:3px solid #e0ddd6;border-top-color:var(--p,#185FA5);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
/* User list row */
.u-row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #eee;border-radius:10px;padding:9px 13px;margin-bottom:6px;transition:all .15s}
.u-row.sel{background:var(--pbg,#e6f1fb);border-color:var(--p,#185FA5)}
</style>
</head>
<body>
<div id="app"><div class="page"><div class="spinner"></div></div></div>

<script>
// ─── Sessão (sessionStorage — limpo ao fechar a aba) ─────────────────────────
function getToken(){ return sessionStorage.getItem('adminToken')||''; }
function getRole() { return sessionStorage.getItem('adminRole')||''; }
function saveSession(token,role){ sessionStorage.setItem('adminToken',token); sessionStorage.setItem('adminRole',role); }
function clearSession(){ sessionStorage.removeItem('adminToken'); sessionStorage.removeItem('adminRole'); }

// ─── API ──────────────────────────────────────────────────────────────────────
function authH(){ return {'X-Admin-Token':getToken()}; }
function authJ(){ return {'Content-Type':'application/json','X-Admin-Token':getToken()}; }

const api = {
  get:     async p      => (await fetch(p,{headers:authH()})).json(),
  post:    async (p,d)  => (await fetch(p,{method:'POST',  headers:authJ(),body:JSON.stringify(d)})).json(),
  patch:   async (p,d)  => (await fetch(p,{method:'PATCH', headers:authJ(),body:JSON.stringify(d)})).json(),
  del:     async p      => (await fetch(p,{method:'DELETE',headers:authH()})).json(),
  postTxt: async (p,t)  => (await fetch(p,{method:'POST',  headers:authJ(),body:JSON.stringify({csv:t})})).json(),
  upload:  async (p,k,f)=> { const fd=new FormData(); fd.append(k,f); return (await fetch(p,{method:'POST',headers:authH(),body:fd})).json(); },
};

// ─── Download helper (fetch+blob — garante envio do token) ───────────────────
async function downloadFile(url, filename){
  try{
    const resp = await fetch(url, {headers: authH()});
    if(!resp.ok){
      let msg = 'Erro HTTP '+resp.status;
      try{ const j=await resp.json(); msg=j.error||msg; }catch{}
      toast(msg,'danger'); return;
    }
    const blob = await resp.blob();
    const objUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=objUrl; a.download=filename; a.style.display='none';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(objUrl); },300);
    toast('Download: '+filename,'success');
  }catch(e){ console.error(e); toast('Erro ao baixar arquivo.','danger'); }
}
function exportarCSV()       { downloadFile('/api/usuarios/exportar','membros.xlsx'); }
function exportarPresenca()  { downloadFile('/api/presenca/exportar-xlsx','lista-presenca.xlsx'); }
function exportarResultado() { downloadFile('/api/resultados/exportar-xlsx','resultado-eleicao.xlsx'); }

// ─── Estado UI ────────────────────────────────────────────────────────────────
let S = { tab:'usuarios', users:[], candidatos:[], cargos:[], presentes:[], elStatus:'aguardando', cargoAtivo:null, cargosEncerrados:[], cargosVotados:{}, resultados:{}, config:{} };
let _pollTimer = null;

// ─── Utilitários ─────────────────────────────────────────────────────────────
const $  = id => document.getElementById(id);
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmtCPF = v => v.replace(/\D/g,'').replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4').slice(0,14);

function validCPF(cpf){
  cpf=cpf.replace(/\D/g,'');
  if(cpf.length!==11||/^(\d)\1{10}$/.test(cpf))return false;
  let s=0;for(let i=0;i<9;i++)s+=+cpf[i]*(10-i);let r=(s*10)%11;if(r>=10)r=0;if(r!==+cpf[9])return false;
  s=0;for(let i=0;i<10;i++)s+=+cpf[i]*(11-i);r=(s*10)%11;if(r>=10)r=0;return r===+cpf[10];
}

let _tTimer=null;
function toast(msg,type='info'){
  document.querySelector('.toast')?.remove();
  if(_tTimer)clearTimeout(_tTimer);
  const el=document.createElement('div'); el.className='toast';
  const st={info:'background:var(--pbg);color:var(--p);border:1px solid var(--p)',success:'background:#eaf3de;color:#3B6D11;border:1px solid #3B6D11',warn:'background:#faeeda;color:#854F0B;border:1px solid #854F0B',danger:'background:#fcebeb;color:#a32d2d;border:1px solid #a32d2d'};
  el.style.cssText=st[type]||st.info; el.textContent=msg; document.body.appendChild(el);
  _tTimer=setTimeout(()=>el.remove(),3400);
}

function applyTheme(c){
  if(!c)return;
  const p=c.corPrimaria||'#185FA5',s=c.corSecundaria||'#3B6D11';
  const hexBg=h=>{try{const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return`rgba(${r},${g},${b},.1)`;}catch{return'rgba(24,95,165,.1)';}};
  document.documentElement.style.setProperty('--p',p);
  document.documentElement.style.setProperty('--s',s);
  document.documentElement.style.setProperty('--pbg',hexBg(p));
  document.documentElement.style.setProperty('--sbg',hexBg(s));
  document.documentElement.style.setProperty('--bg',c.corFundo||'#f0ede6');
  document.documentElement.style.setProperty('--tx',c.corTexto||'#1a1a18');
  document.body.style.background=c.corFundo||'#f0ede6';
}

function avHTML(c,sz){
  if(!c)return'';
  if(c.fotoUrl)
    return`<img src="${esc(c.fotoUrl)}" style="width:${sz}px;height:${sz}px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid #ddd" onerror="this.style.display='none'">`;
  return`<div style="width:${sz}px;height:${sz}px;border-radius:50%;background:#f0ede6;display:flex;align-items:center;justify-content:center;font-size:${Math.round(sz*.4)}px;flex-shrink:0">😊</div>`;
}

async function loadState(){
  const d=await api.get('/api/state');
  S.users=d.users||[];S.candidatos=d.candidatos||[];S.cargos=d.cargos||[];
  S.presentes=d.presentes||[];S.elStatus=d.elStatus||'aguardando';S.cargoAtivo=d.cargoAtivo||null;S.cargosEncerrados=d.cargosEncerrados||[];S.cargosVotados=d.cargosVotados||{};S.resultados=d.resultados||{};S.config=d.config||{};
  applyTheme(S.config);
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
(async()=>{
  await loadState();
  const saved=getToken();
  if(saved){
    const chk=await api.get('/api/auth/check');
    if(chk.valid){renderAdmin();return;}
    clearSession();
  }
  renderLogin();
})();

// ─── LOGIN ────────────────────────────────────────────────────────────────────
function renderLogin(){
  const c=S.config;
  const cargoAtivoNome=S.cargoAtivo?(S.cargos.find(g=>g.id===S.cargoAtivo)||{}).nome:'';
  const sb=S.elStatus==='ativa'&&S.cargoAtivo?'<span class="badge bdg-ok">Votando: '+esc(cargoAtivoNome||'')+'</span>':S.cargosEncerrados.length?'<span class="badge bdg-warn">'+S.cargosEncerrados.length+' cargo(s) encerrado(s)</span>':'<span class="badge bdg-gray">Aguardando</span>';
  $('app').innerHTML=`
  <div class="page"><div class="wrap">
    <div style="text-align:center;margin-bottom:22px">
      ${c.logoUrl?`<img src="${esc(c.logoUrl)}" style="max-height:60px;margin-bottom:12px;display:block;margin-left:auto;margin-right:auto">`:'<div style="font-size:52px;margin-bottom:10px">🗳️</div>'}
      <h1 style="font-size:21px;font-weight:700">${esc(c.nomeInstituicao||'Eleição de Oficiais da Igreja')}</h1>
      <p style="font-size:13px;color:#888;margin-top:5px">Painel Administrativo</p>
    </div>
    <div class="card">
      <div class="field"><label>Usuário</label><input id="l-cpf" class="input" placeholder="admin" autocomplete="username"></div>
      <div class="field"><label>Senha</label><input id="l-pwd" class="input" type="password" placeholder="••••••" autocomplete="current-password"></div>
      <div id="l-err" style="display:none" class="err-box"></div>
      <button class="btn btn-p btn-full" onclick="doLogin()">Entrar no painel</button>
      <div style="margin-top:12px;padding:10px;background:var(--bg,#f0ede6);border-radius:8px;font-size:11px;color:#888;line-height:2">
        <a href="/votar"   style="color:var(--p)" target="_blank">🗳️ Votação</a> &nbsp;·&nbsp;
        <a href="/checkin" style="color:var(--p)" target="_blank">📷 Check-in</a> &nbsp;·&nbsp;
        <a href="/datashow" style="color:var(--p)" target="_blank">📺 Datashow</a>
      </div>
    </div>
    <div style="text-align:center;margin-top:10px">${sb}</div>
  </div></div>`;
  const li=$('l-cpf'),lp=$('l-pwd');
  if(li)li.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
  if(lp)lp.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
}

async function doLogin(){
  const cpf=($('l-cpf').value||'').trim(),pwd=$('l-pwd').value;
  const e=$('l-err');e.style.display='none';
  if(!cpf){e.textContent='Digite o usuário.';e.style.display='block';return;}
  const res=await api.post('/api/login',{cpf,pwd});
  if(res.error){e.textContent=res.error;e.style.display='block';return;}
  saveSession(res.token,res.role);
  await loadState();renderAdmin();
}

// ─── ADMIN SHELL ──────────────────────────────────────────────────────────────
function renderAdmin(){
  const st=S.elStatus;
  const sb=st==='ativa'?'<span class="badge bdg-ok">Ativa</span>':st==='encerrada'?'<span class="badge bdg-warn">Encerrada</span>':'<span class="badge bdg-gray">Aguardando</span>';
  const tabs=[['usuarios','Membros'],['presenca','Presença'],['candidatos','Candidatos'],['cargos','Cargos'],['eleicao','Eleição'],['resultados','Resultados'],['configuracoes','Configurações']];
  const th=tabs.map(([id,lbl])=>`<button class="tab-btn ${S.tab===id?'active':''}" onclick="setTab('${id}')">${lbl}</button>`).join('');
  $('app').innerHTML=`
  <div style="min-height:100vh;background:var(--bg,#f0ede6)">
    <div class="topbar">
      ${S.config.logoUrl?`<img src="${esc(S.config.logoUrl)}" style="height:26px">`:'<span style="font-size:18px">🗳️</span>'}
      <span style="font-weight:700;font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(S.config.nomeInstituicao||'Eleição de Oficiais da Igreja')}</span>
      ${sb}
      <div style="display:flex;gap:6px;margin-left:8px">
        <a class="btn btn-sm btn-p" href="/votar" target="_blank">🗳️</a>
        <a class="btn btn-sm" href="/datashow" target="_blank">📺</a>
        <button class="btn btn-sm" onclick="doLogout()">Sair</button>
      </div>
    </div>
    <div class="tabs">${th}</div>
    <div id="tab-content" class="container" style="padding-top:20px"></div>
  </div>`;
  renderTab();
}

async function setTab(id){
  S.tab=id;
  document.querySelectorAll('.tab-btn').forEach(b=>{
    const labels={usuarios:'Membros',presenca:'Presença',candidatos:'Candidatos',cargos:'Cargos',eleicao:'Eleição',resultados:'Resultados',configuracoes:'Configurações'};
    b.classList.toggle('active',b.textContent===labels[id]);
  });
  if(id!=='eleicao')stopPoll();
  await renderTab();
}

async function renderTab(){
  await loadState();
  const el=$('tab-content');if(!el)return;
  const fn={usuarios:tabUsuarios,presenca:tabPresenca,candidatos:tabCandidatos,cargos:tabCargos,eleicao:tabEleicao,resultados:tabResultados,configuracoes:tabConfig}[S.tab];
  if(fn){ const html=await fn(); el.innerHTML=html; }
  bindTabEvents();
  if(S.tab==='eleicao'&&S.elStatus==='ativa')startPoll();
}

function doLogout(){
  api.post('/api/logout',{}).catch(()=>{});
  clearSession();stopPoll();renderLogin();
}

// ─── TAB: USUÁRIOS ────────────────────────────────────────────────────────────
let _uFilter='', _uSort='nome-asc', _uSel=new Set();

function tabUsuarios(){
  _uSel=new Set();
  return `
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px"><h3 style="font-weight:700">Membros</h3><span style="background:var(--pbg);color:var(--p);font-size:13px;font-weight:700;padding:3px 12px;border-radius:20px">${S.users.length} cadastrado${S.users.length!==1?'s':''}</span></div>

  <div class="card">
    <div class="grid2" style="gap:10px">
      <div class="field" style="margin:0"><label>Nome completo</label><input id="u-nome" class="input" placeholder="Nome completo"></div>
      <div class="field" style="margin:0">
        <label>CPF <span style="font-weight:400;color:#aaa;font-size:10px">(opcional — pode ser adicionado no check-in)</span> <span id="u-cpf-st" style="font-weight:400;font-size:11px"></span></label>
        <input id="u-cpf" class="input" placeholder="000.000.000-00" maxlength="14">
      </div>
    </div>
    <div id="u-err" class="err-box" style="display:none;margin-top:8px"></div>
    <button class="btn btn-p" style="margin-top:10px" onclick="addUser()">+ Adicionar membro</button>
  </div>

  <div class="card">
    <p style="font-size:13px;font-weight:600;margin-bottom:8px">📥 Importar / Exportar</p>
    <p style="font-size:12px;color:#888;margin-bottom:8px">
      CSV: colunas <code>nome,cpf</code> · XLSX: mesmas colunas na linha 1.<br>
      Arquivo modelo: <code>modelo-importacao.csv</code>
    </p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <label class="btn btn-p" style="cursor:pointer">📂 CSV<input type="file" accept=".csv,.txt" style="display:none" onchange="importCSV(this)"></label>
      <label class="btn btn-p" style="cursor:pointer">📊 XLSX<input type="file" accept=".xlsx,.xls" style="display:none" onchange="importXLSX(this)"></label>
      <button class="btn" onclick="exportarCSV()">📊 Exportar XLSX</button>
    </div>
    <div id="import-msg" style="display:none;margin-top:10px"></div>
  </div>

  <div class="card" style="padding:12px 14px">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px">
      <div style="flex:1;min-width:160px">
        <label style="font-size:11px;color:#888;font-weight:600;display:block;margin-bottom:4px">Filtrar</label>
        <input id="u-filter" class="input" placeholder="🔍 Nome ou CPF..." value="${esc(_uFilter)}"
          style="margin:0" oninput="uFiltrar(this.value)">
      </div>
      <div>
        <label style="font-size:11px;color:#888;font-weight:600;display:block;margin-bottom:4px">Ordenar</label>
        <select id="u-sort" class="input" style="margin:0;width:auto" onchange="uOrdenar(this.value)">
          <option value="nome-asc"  ${_uSort==='nome-asc' ?'selected':''}>Nome A→Z</option>
          <option value="nome-desc" ${_uSort==='nome-desc'?'selected':''}>Nome Z→A</option>
          <option value="cpf-asc"   ${_uSort==='cpf-asc'  ?'selected':''}>CPF ↑</option>
          <option value="cpf-desc"  ${_uSort==='cpf-desc' ?'selected':''}>CPF ↓</option>
        </select>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <label style="font-size:12px;color:#666;display:flex;align-items:center;gap:6px;cursor:pointer">
        <input type="checkbox" id="u-chk-all" onchange="uSelTodos(this.checked)"> Selecionar todos visíveis
      </label>
      <span id="u-sel-info" style="font-size:12px;color:var(--p);font-weight:600"></span>
      <button id="u-del-btn" class="btn btn-danger btn-sm" style="display:none" onclick="uDelSel()">🗑 Excluir selecionados</button>
    </div>
  </div>

  <div id="u-list">${uRenderList()}</div>

  <div id="modal-edit" class="modal-bg" style="display:none">
    <div class="card" style="max-width:400px;width:100%">
      <h3 style="font-weight:700;margin-bottom:14px">✏️ Editar Eleitor</h3>
      <div class="field"><label>Nome</label><input id="eu-nome" class="input"></div>
      <div class="field">
        <label>CPF <span id="eu-cpf-st" style="font-weight:400;color:#aaa;font-size:11px"></span></label>
        <input id="eu-cpf" class="input" maxlength="14">
      </div>
      <div id="eu-err" class="err-box" style="display:none"></div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn" style="flex:1" onclick="$('modal-edit').style.display='none'">Cancelar</button>
        <button class="btn btn-p" style="flex:1" onclick="saveEditUser()">Salvar ✓</button>
      </div>
    </div>
  </div>`;
}

function uGetList(){
  const q=_uFilter.toLowerCase().trim();
  let list=q?S.users.filter(u=>u.nome.toLowerCase().includes(q)||u.cpf.includes(q)):S.users.slice();
  list.sort((a,b)=>{
    if(_uSort==='nome-asc') return a.nome.localeCompare(b.nome);
    if(_uSort==='nome-desc')return b.nome.localeCompare(a.nome);
    if(_uSort==='cpf-asc')  return a.cpf.localeCompare(b.cpf);
    if(_uSort==='cpf-desc') return b.cpf.localeCompare(a.cpf);
    return 0;
  });
  return list;
}

function uRenderList(){
  const list=uGetList();
  if(!list.length)return '<p style="color:#aaa;font-size:13px;padding:12px 0">Nenhum eleitor encontrado.</p>';
  return list.map(u=>{
    const sel=_uSel.has(u.id);
    return`<div class="u-row ${sel?'sel':''}" id="urow-${u.id}">
      <input type="checkbox" ${sel?'checked':''} onchange="uToggle('${u.id}',this.checked)" style="cursor:pointer;width:16px;height:16px;flex-shrink:0">
      <div style="width:32px;height:32px;border-radius:50%;background:var(--pbg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:var(--p);flex-shrink:0">${esc(u.nome[0])}</div>
      <div style="flex:1;min-width:0">
        <p style="font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(u.nome)}</p>
        <p style="font-size:11px;color:#888">${u.cpf?esc(u.cpf):'<span style="color:#854F0B;font-style:italic">Sem CPF — será registrado no check-in</span>'}</p>
      </div>
      <button class="btn btn-p btn-sm" onclick="editUser('${u.id}')">✏️</button>
      <button class="btn btn-danger btn-sm" onclick="delUser('${u.id}')">×</button>
    </div>`;
  }).join('');
}

function uFiltrar(q){ _uFilter=q; const el=$('u-list'); if(el)el.innerHTML=uRenderList(); uCtrl(); }
function uOrdenar(v){ _uSort=v;   const el=$('u-list'); if(el)el.innerHTML=uRenderList(); }
function uToggle(id,chk){
  if(chk)_uSel.add(id);else _uSel.delete(id);
  const row=$('urow-'+id);
  if(row)row.className='u-row '+(chk?'sel':'');
  uCtrl();
}
function uSelTodos(chk){
  uGetList().forEach(u=>chk?_uSel.add(u.id):_uSel.delete(u.id));
  const el=$('u-list');if(el)el.innerHTML=uRenderList();
  uCtrl();
}
function uCtrl(){
  const n=_uSel.size,si=$('u-sel-info'),db=$('u-del-btn');
  if(si)si.textContent=n>0?n+' selecionado'+(n!==1?'s':''):'';
  if(db)db.style.display=n>0?'inline-flex':'none';
}
async function uDelSel(){
  const ids=[..._uSel];if(!ids.length)return;
  if(!confirm('Excluir '+ids.length+' eleitor(es)? Esta ação não pode ser desfeita.'))return;
  for(const id of ids)await api.del('/api/usuarios/'+id);
  _uSel.clear();
  toast(ids.length+' eleitor(es) excluído(s).','warn');
  await renderTab();
}
async function addUser(){
  const nome=($('u-nome').value||'').trim(),cpf=($('u-cpf').value||'').trim();
  const e=$('u-err');e.style.display='none';
  if(!nome){e.textContent='Nome obrigatório.';e.style.display='block';return;}
  if(cpf&&!validCPF(cpf)){e.textContent='CPF inválido. Verifique os dígitos.';e.style.display='block';return;}
  const res=await api.post('/api/usuarios',{nome,cpf});
  if(res.error){e.textContent=res.error;e.style.display='block';return;}
  toast('Membro adicionado!','success');await renderTab();
}
let _editId=null;
function editUser(id){
  const u=S.users.find(x=>x.id===id);if(!u)return;
  _editId=id;
  $('eu-nome').value=u.nome;$('eu-cpf').value=u.cpf;
  $('eu-err').style.display='none';
  $('modal-edit').style.display='flex';
  cpfInput('eu-cpf','eu-cpf-st');
}
async function saveEditUser(){
  const nome=($('eu-nome').value||'').trim(),cpf=($('eu-cpf').value||'').trim();
  const e=$('eu-err');e.style.display='none';
  if(!nome||!cpf){e.textContent='Nome e CPF obrigatórios.';e.style.display='block';return;}
  const res=await api.patch('/api/usuarios/'+_editId,{nome,cpf});
  if(res.error){e.textContent=res.error;e.style.display='block';return;}
  $('modal-edit').style.display='none';
  toast('Membro atualizado!','success');await renderTab();
}
async function delUser(id){
  if(!confirm('Remover este eleitor?'))return;
  await api.del('/api/usuarios/'+id);toast('Membro removido.','warn');await renderTab();
}
async function importCSV(input){
  const file=input.files[0];if(!file)return;
  const text=await file.text(),m=$('import-msg');
  m.style.display='block';m.className='info-box';m.textContent='Importando CSV...';
  const res=await api.postTxt('/api/usuarios/importar',text);
  if(res.error){m.className='err-box';m.textContent=res.error;return;}
  const errosTxt=res.erros&&res.erros.length?' ('+res.erros.slice(0,3).join('; ')+(res.erros.length>3?'…':'')+')'  :'';
  m.className='succ-box';m.textContent='✓ '+res.added+' adicionado(s), '+res.skipped+' ignorado(s).'+errosTxt;
  toast(res.added+' membro(s) importado(s)!','success');await renderTab();
}

async function importXLSX(input){
  const file=input.files[0];if(!file)return;
  const m=$('import-msg');
  m.style.display='block';m.className='info-box';m.textContent='Importando XLSX...';
  try{
    const fd=new FormData();fd.append('file',file);
    const resp=await fetch('/api/usuarios/importar-xlsx',{method:'POST',headers:authH(),body:fd});
    const res=await resp.json();
    if(res.error){m.className='err-box';m.textContent='Erro: '+res.error;return;}
    const errosTxt=res.erros&&res.erros.length?' ('+res.erros.slice(0,3).join('; ')+(res.erros.length>3?'…':'')+')'  :'';
    m.className='succ-box';m.textContent='✓ '+res.added+' adicionado(s), '+res.skipped+' ignorado(s).'+errosTxt;
    toast(res.added+' membro(s) importado(s)!','success');await renderTab();
  }catch(e){m.className='err-box';m.textContent='Erro ao processar arquivo.';}
}

// ─── TAB: PRESENÇA ────────────────────────────────────────────────────────────
function tabPresenca(){
  var totalMembros=S.users.length;
  var totalPresentes=S.presentes.length;
  var quorum=totalMembros>0?Math.ceil(totalMembros/2):0;
  var quorumAtingido=totalPresentes>=quorum&&totalMembros>0;
  var pct=totalMembros>0?Math.round(totalPresentes/totalMembros*100):0;
  var votadosCargo=(S.cargoAtivo&&S.cargosVotados[S.cargoAtivo])?S.cargosVotados[S.cargoAtivo]:[];
  var naoVotou=S.users.filter(function(u){return S.presentes.some(function(p){return p.id===u.id;})&&!votadosCargo.includes(u.id);});
  var alerta=S.elStatus==='ativa'&&S.cargoAtivo&&naoVotou.length>0
    ?'<div class="warn-box" style="margin-bottom:12px"><strong>Ainda não votaram ('+naoVotou.length+'):</strong>'+naoVotou.map(function(u){return '<br>· '+esc(u.nome);}).join('')+'</div>':'';
  var quorumBadge=quorumAtingido
    ?'<span style="background:#eaf3de;color:#3B6D11;font-size:12px;font-weight:700;padding:3px 10px;border-radius:6px">✓ Quórum mínimo atingido!</span>'
    :'<span style="font-size:12px;color:#aaa">Quórum mínimo: '+quorum+' presentes</span>';

  // O container principal é renderizado 1 vez.
  // A lista (#pres-rows) é atualizada separadamente por pRenderRows(),
  // evitando destruir o <input> de filtro e perder o foco.
  return '<h3 style="font-weight:700;margin-bottom:8px">Lista de Presença</h3>'
    +'<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px">'
      +'<span style="font-size:12px;color:#888">'+totalPresentes+' de '+totalMembros+' presentes ('+pct+'%)</span>'
      +(S.cargoAtivo?' · <span style="font-size:12px;color:#888">'+votadosCargo.length+' votaram neste cargo</span>':'')
      +quorumBadge
    +'</div>'
    +'<div class="card" style="padding:12px 14px;margin-bottom:10px">'
      +'<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">'
        +'<div style="flex:1;min-width:160px">'
          +'<label style="font-size:11px;color:#888;font-weight:600;display:block;margin-bottom:4px">Filtrar</label>'
          // IMPORTANTE: oninput atualiza só #pres-rows, NÃO reconstrói o tab inteiro
          +'<input id="p-filter" class="input" placeholder="🔍 Nome ou CPF..." value="'+esc(_pFiltro)+'" style="margin:0" oninput="pFiltrar(this.value)">'
        +'</div>'
        +'<div>'
          +'<label style="font-size:11px;color:#888;font-weight:600;display:block;margin-bottom:4px">Ordenar</label>'
          +'<select class="input" style="margin:0;width:auto" onchange="pOrdenar(this.value)">'
            +'<option value="nome-asc"  '+(_pOrdem==='nome-asc'  ?'selected':'')+'>Nome A→Z</option>'
            +'<option value="nome-desc" '+(_pOrdem==='nome-desc' ?'selected':'')+'>Nome Z→A</option>'
            +'<option value="data-desc" '+(_pOrdem==='data-desc' ?'selected':'')+'>Check-in mais recente</option>'
            +'<option value="data-asc"  '+(_pOrdem==='data-asc'  ?'selected':'')+'>Check-in mais antigo</option>'
          +'</select>'
        +'</div>'
      +'</div>'
    +'</div>'
    +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">'
      +'<button class="btn btn-s btn-sm" onclick="presMarcarTodos()">✓ Marcar todos</button>'
      +'<button class="btn btn-danger btn-sm" onclick="presDesmarcarTodos()">✗ Desmarcar todos</button>'
      +'<button class="btn btn-p btn-sm" onclick="exportarPresenca()">📊 Exportar .xlsx</button>'
    +'</div>'
    +alerta
    // Container da lista — atualizado por pRenderRows() sem recriar o input
    +'<div id="pres-rows">'+pBuildRows()+'</div>';
}

var _pFiltro='', _pOrdem='nome-asc';

// Gera HTML das linhas da lista de presença
function pBuildRows(){
  var votadosC=(S.cargoAtivo&&S.cargosVotados[S.cargoAtivo])?S.cargosVotados[S.cargoAtivo]:[];
  var q=(_pFiltro||'').toLowerCase().trim();
  var lista=S.users.slice();
  if(q) lista=lista.filter(function(u){ return u.nome.toLowerCase().includes(q)||u.cpf.includes(q); });
  lista.sort(function(a,b){
    if(_pOrdem==='nome-asc')  return a.nome.localeCompare(b.nome);
    if(_pOrdem==='nome-desc') return b.nome.localeCompare(a.nome);
    var da=S.presentes.find(function(p){return p.id===a.id;});
    var db=S.presentes.find(function(p){return p.id===b.id;});
    var ta=da&&da.dataHora?new Date(da.dataHora).getTime():0;
    var tb=db&&db.dataHora?new Date(db.dataHora).getTime():0;
    if(_pOrdem==='data-asc')  return ta-tb;
    if(_pOrdem==='data-desc') return tb-ta;
    return a.nome.localeCompare(b.nome);
  });
  if(!lista.length) return '<p style="color:#aaa;font-size:13px;padding:8px 0">Nenhum membro encontrado.</p>';
  return lista.map(function(u){
    var entry=S.presentes.find(function(p){return p.id===u.id;});
    var presente=!!entry, votou=votadosC.includes(u.id);
    var dh=entry&&entry.dataHora?fmtDH(entry.dataHora):'—';
    // onclick usa data-attribute para evitar qualquer problema de aspas
    var row='<div class="pres-item'+(presente?' p':'')+'"'
      +' data-uid="'+u.id+'"'
      +(votou?' style="cursor:default"':' onclick="presClickItem(this)"')
      +'>';
    row+='<div style="width:20px;height:20px;border-radius:50%;border:1.5px solid '+(presente?'#3B6D11':'#bbb')
      +';background:'+(presente?'#3B6D11':'transparent')
      +';display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;color:#fff;font-weight:700">'
      +(presente?'✓':'')+'</div>';
    row+='<div style="flex:1">';
    row+='<p style="font-size:13px;font-weight:600">'+esc(u.nome)+'</p>';
    row+='<p style="font-size:11px;color:#888">'+esc(u.cpf)+'</p>';
    if(presente) row+='<p style="font-size:10px;color:#aaa;margin-top:2px">📅 '+dh+'</p>';
    row+='</div>';
    if(votou)        row+='<span class="badge bdg-ok">Votou</span>';
    else if(presente) row+='<span class="badge bdg-info">Presente</span>';
    row+='</div>';
    return row;
  }).join('');
}

// Lê o data-uid do elemento clicado e chama presToggle
// Evita qualquer manipulação de aspas no onclick gerado dinamicamente
function presClickItem(el){
  var uid=el.getAttribute('data-uid');
  if(uid) presToggle(uid);
}

// Filtro: atualiza só #pres-rows sem recriar o input (preserva foco)
function pFiltrar(q){
  _pFiltro=q;
  var el=document.getElementById('pres-rows');
  if(el) el.innerHTML=pBuildRows();
}

// Ordenação: atualiza só #pres-rows
function pOrdenar(v){
  _pOrdem=v;
  var el=document.getElementById('pres-rows');
  if(el) el.innerHTML=pBuildRows();
}

function fmtDH(iso){
  if(!iso)return '—';
  try{
    var d=new Date(iso);
    return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  }catch(e){return '—';}
}

// ─── TAB: CANDIDATOS ─────────────────────────────────────────────────────────
var _fotoCandFile=null;

function tabCandidatos(){
  var candIds=S.candidatos.map(function(c){return c.userId;});
  var disp=S.users.filter(function(u){return candIds.indexOf(u.id)<0;}).sort(function(a,b){return a.nome.localeCompare(b.nome,'pt-BR');});

  // Selector de membro
  var selMembro=disp.length>0
    ?'<div class="field"><label>Membro</label>'
      +'<select id="c-userid" class="input">'
        +'<option value="">-- Escolha um membro --</option>'
        +disp.map(function(u){return '<option value="'+esc(u.id)+'">'+esc(u.nome)+(u.cpf?' — '+esc(u.cpf):'')+'</option>';}).join('')
      +'</select></div>'
    :'<div class="warn-box">Todos os membros já são candidatos ou não há membros cadastrados.</div>';

  // Selector de cargo (sincronizado com S.cargos)
  var selCargo=S.cargos.length>0
    ?'<div class="field"><label>Cargo que irá concorrer</label>'
      +'<select id="c-cargo" class="input">'
        +'<option value="">-- Escolha o cargo --</option>'
        +S.cargos.map(function(g){return '<option value="'+esc(g.id)+'">'+esc(g.nome)+' ('+g.vagas+' vaga'+(g.vagas>1?'s':'')+')</option>';}).join('')
      +'</select></div>'
    :'<div class="warn-box" style="margin-top:8px">⚠ Cadastre cargos primeiro na aba <strong>Cargos</strong>.</div>';

  // Agrupa candidatos por cargo
  var html='<h3 style="font-weight:700;margin-bottom:14px">Candidatos ('+S.candidatos.length+')</h3>';
  if(S.candidatos.some(function(c){return !c.fotoUrl;}))
    html+='<div class="warn-box" style="margin-bottom:12px">⚠ Candidatos sem foto não aparecerão corretamente nas cédulas. Adicione a foto de cada um.</div>';

  // Formulário de adição
  html+='<div class="card" style="margin-bottom:14px">'
    +selMembro
    +selCargo
    
    +'<div class="field"><label>Foto <span style="color:#a32d2d">*</span> obrigatória</label>'
      +'<label class="btn btn-p btn-sm" style="cursor:pointer;width:fit-content;margin-top:2px">📷 Escolher foto'
        +'<input type="file" id="c-foto-in" accept="image/*" style="display:none" onchange="prevFoto(this)"></label>'
      +'<div id="c-foto-prev" style="margin-top:6px"></div></div>'
    +'<button class="btn btn-p" onclick="addCand()">+ Adicionar candidato</button>'
    +'</div>';

  // Lista agrupada por cargo
  if(S.candidatos.length===0){
    html+='<p style="color:#aaa;font-size:13px;text-align:center;padding:20px">Nenhum candidato cadastrado ainda.</p>';
  } else {
    S.cargos.forEach(function(g){
      var cands=S.candidatos.filter(function(c){return c.cargoId===g.id;}).sort(function(a,b){return a.nome.localeCompare(b.nome,'pt-BR');});
      if(cands.length===0)return;
      html+='<div style="margin-bottom:18px">'
        +'<p style="font-size:13px;font-weight:700;color:var(--p);margin-bottom:8px;padding-bottom:4px;border-bottom:2px solid var(--pbg)">'
        +'🏛️ '+esc(g.nome)+' <span style="font-size:11px;color:#aaa;font-weight:400">— '+cands.length+' candidato'+(cands.length>1?'s':'')+' / '+g.vagas+' vaga'+(g.vagas>1?'s':'')+'</span></p>';
      html+=cands.map(function(c){return candidatoCard(c);}).join('');
      html+='</div>';
    });
    // Candidatos sem cargo válido (órfãos)
    var orfaos=S.candidatos.filter(function(c){return !S.cargos.find(function(g){return g.id===c.cargoId;});}).sort(function(a,b){return a.nome.localeCompare(b.nome,'pt-BR');});
    if(orfaos.length>0){
      html+='<div style="margin-bottom:18px">'
        +'<p style="font-size:13px;font-weight:700;color:#a32d2d;margin-bottom:8px">⚠ Sem cargo (cargo removido)</p>';
      html+=orfaos.map(function(c){return candidatoCard(c);}).join('');
      html+='</div>';
    }
  }
  return html;
}

// Card individual de candidato — botões usam data-cid (sem problema de aspas)
function candidatoCard(c){
  var foto=c.fotoUrl
    ?'<img src="'+esc(c.fotoUrl)+'" style="width:48px;height:48px;border-radius:50%;object-fit:cover;border:1px solid #ddd;flex-shrink:0">'
    :'<div style="width:48px;height:48px;border-radius:50%;background:#faeeda;display:flex;align-items:center;justify-content:center;font-size:11px;color:#854F0B;text-align:center;flex-shrink:0;line-height:1.2;padding:4px;font-weight:600">Sem<br>foto</div>';
  return '<div class="card-sm" style="display:flex;align-items:center;gap:12px;margin-bottom:8px">'
    +foto
    +'<div style="flex:1">'
      +'<p style="font-weight:600;font-size:13px">'+esc(c.nome)+'</p>'
      +(!c.fotoUrl?'<p style="font-size:10px;color:#a32d2d;font-weight:600;margin-top:2px">⚠ Foto obrigatória</p>':'')
    +'</div>'
    +'<label class="btn '+(c.fotoUrl?'btn-p':'btn-danger')+' btn-sm" style="cursor:pointer">'
      +(c.fotoUrl?'📷 Trocar':'📷 Foto')
      +'<input type="file" accept="image/*" style="display:none" data-cid="'+c.id+'" onchange="uploadFotoEl(this)"></label>'
    +'<button class="btn btn-danger btn-sm" data-cid="'+c.id+'" onclick="delCandEl(this)">×</button>'
    +'</div>';
}

// Handlers que leem data-cid (corrige bug do botão excluir)
function delCandEl(el){ var id=el.getAttribute('data-cid'); if(id) delCand(id); }
function uploadFotoEl(el){ var id=el.getAttribute('data-cid'); if(id) uploadFoto(id, el); }


function prevFoto(input){
  const file=input.files[0];if(!file)return;
  _fotoCandFile=file;
  const r=new FileReader();
  r.onload=e=>{const p=$('c-foto-prev');if(p)p.innerHTML=`<img src="${e.target.result}" style="width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid var(--p)">`};
  r.readAsDataURL(file);
}
async function addCand(){
  const userId=($('c-userid')?$('c-userid').value:'');
  const cargoId=($('c-cargo')?$('c-cargo').value:'');

  if(!userId)      {toast('Selecione um membro.','warn');return;}
  if(!cargoId)     {toast('Selecione o cargo que o candidato irá concorrer.','warn');return;}
  if(!_fotoCandFile){toast('A foto é obrigatória.','warn');return;}
  const res=await api.post('/api/candidatos',{userId,cargoId});
  if(res.error){toast(res.error,'danger');return;}
  // Upload da foto
  if(res.candidato&&res.candidato.id){
    await api.upload('/api/candidatos/'+res.candidato.id+'/foto','foto',_fotoCandFile);
  }
  _fotoCandFile=null;
  toast('Candidato adicionado!','success');
  await loadState();await renderTab();
}
async function uploadFoto(id,input){
  const file=input.files[0];if(!file)return;
  toast('Enviando foto...','info');
  const r=await api.upload('/api/candidatos/'+id+'/foto','foto',file);
  if(r.error){toast('Erro: '+r.error,'danger');return;}
  toast('Foto atualizada!','success');await loadState();await renderTab();
}
async function delCand(id){
  if(!confirm('Remover este candidato?'))return;
  const r=await api.del('/api/candidatos/'+id);
  if(r&&r.error){toast(r.error,'danger');return;}
  toast('Candidato removido.','warn');
  await loadState();await renderTab();
}

function tabCargos(){
  const list=S.cargos.map(g=>`
    <div class="card-sm" style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
      <span style="font-size:22px">🏛️</span>
      <div style="flex:1"><p style="font-weight:600;font-size:13px">${esc(g.nome)}</p><p style="font-size:11px;color:#888">${g.vagas} vaga${g.vagas>1?'s':''}</p></div>
      <button class="btn btn-danger btn-sm" onclick="delCargo('${g.id}')">×</button>
    </div>`).join('');
  return`
  <h3 style="font-weight:700;margin-bottom:14px">Cargos (${S.cargos.length})</h3>
  <div class="card" style="margin-bottom:14px">
    <div class="grid2" style="gap:10px;margin-bottom:10px">
      <div class="field" style="margin:0"><label>Nome do cargo</label><input id="g-nome" class="input" placeholder="Ex: Diácono"></div>
      <div class="field" style="margin:0"><label>Vagas</label><input id="g-vagas" class="input" type="number" min="1" value="1"></div>
    </div>
    <button class="btn btn-p" onclick="addCargo()">+ Adicionar cargo</button>
  </div>
  <div>${list}</div>`;
}
async function addCargo() {const n=($('g-nome').value||'').trim(),v=$('g-vagas').value;if(!n||!v){toast('Preencha os campos.','warn');return;}const r=await api.post('/api/cargos',{nome:n,vagas:v});if(r.error){toast(r.error,'danger');return;}toast('Cargo criado!','success');await renderTab();}
async function delCargo(id){if(!confirm('Remover?'))return;await api.del('/api/cargos/'+id);toast('Membro removido.','warn');await renderTab();}

// ─── TAB: ELEIÇÃO ─────────────────────────────────────────────────────────────
function tabEleicao(){
  var quorum=S.users.length>0?Math.ceil(S.users.length/2):0;
  var quorumOk=S.presentes.length>=quorum&&S.users.length>0;
  var stats='<div class="grid2" style="margin-bottom:8px">'
    +[['👥','Membros',S.users.length],['🙋','Presentes',S.presentes.length],['🏛️','Cargos',S.cargos.length],['👤','Candidatos',S.candidatos.length]]
      .map(function(x){return '<div class="stat-card"><div class="lbl">'+x[0]+' '+x[1]+'</div><div class="val">'+x[2]+'</div></div>';}).join('')
    +'</div>'
    +(quorumOk
      ?'<div style="background:#eaf3de;color:#3B6D11;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;margin-bottom:14px">✓ Quórum atingido! ('+S.presentes.length+'/'+quorum+')</div>'
      :'<div style="background:#f8f8f6;color:#888;border-radius:8px;padding:8px 14px;font-size:12px;margin-bottom:14px">Quórum mínimo: '+quorum+' presentes (50% dos '+S.users.length+' membros)</div>');

  var html='<h3 style="font-weight:700;margin-bottom:14px">Controle da Eleição por Cargo</h3>'+stats;

  // Card do cargo ativo (se houver)
  if(S.elStatus==='ativa'&&S.cargoAtivo){
    var cargoAtivo=S.cargos.find(function(g){return g.id===S.cargoAtivo;});
    var votados=(S.cargosVotados[S.cargoAtivo]||[]).length;
    var faltam=S.presentes.length-votados;
    html+='<div class="card" style="border:2px solid var(--s);margin-bottom:14px">'
      +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">'
        +'<span class="badge bdg-ok">● Em votação</span>'
        +'<span style="font-weight:700;font-size:15px">'+esc(cargoAtivo?cargoAtivo.nome:'')+'</span>'
      +'</div>'
      +'<p style="font-size:13px;color:#666;margin-bottom:12px">'+votados+' voto(s) registrado(s) · '+faltam+' presente(s) ainda não votou neste cargo.</p>'
      +'<button class="btn btn-danger btn-full" onclick="elEncerrar()">⏹ Encerrar votação de '+esc(cargoAtivo?cargoAtivo.nome:'')+'</button>'
      +'</div>';
  } else {
    // Selector para iniciar votação de um cargo
    var cargosDisp=S.cargos.filter(function(g){
      var temCand=S.candidatos.some(function(c){return c.cargoId===g.id;});
      var encerrado=S.cargosEncerrados.indexOf(g.id)>=0;
      return temCand&&!encerrado;
    });
    html+='<div class="card" style="margin-bottom:14px">'
      +'<p style="font-size:13px;font-weight:700;margin-bottom:10px">▶ Iniciar votação de um cargo</p>';
    if(!S.presentes.length){
      html+='<div class="warn-box">Marque a presença de pelo menos 1 membro antes de iniciar.</div>';
    } else if(cargosDisp.length===0){
      html+='<div class="warn-box">Nenhum cargo disponível para votação. Verifique se há candidatos cadastrados e cargos ainda não encerrados.</div>';
    } else {
      html+='<div class="field"><label>Selecione o cargo</label>'
        +'<select id="el-cargo" class="input">'
          +cargosDisp.map(function(g){
            var n=S.candidatos.filter(function(c){return c.cargoId===g.id;}).length;
            return '<option value="'+esc(g.id)+'">'+esc(g.nome)+' ('+n+' candidato'+(n>1?'s':'')+')</option>';
          }).join('')
        +'</select></div>'
        +'<button class="btn btn-s btn-full" onclick="elIniciar()">▶ Iniciar votação</button>';
    }
    html+='</div>';
  }

  // Situação de cada cargo
  html+='<div class="card" style="margin-bottom:14px"><p style="font-size:13px;font-weight:700;margin-bottom:10px">📋 Situação dos cargos</p>';
  if(S.cargos.length===0){
    html+='<p style="font-size:12px;color:#aaa">Nenhum cargo cadastrado.</p>';
  } else {
    html+=S.cargos.map(function(g){
      var nCand=S.candidatos.filter(function(c){return c.cargoId===g.id;}).length;
      var encerrado=S.cargosEncerrados.indexOf(g.id)>=0;
      var ativo=S.cargoAtivo===g.id;
      var nVotos=(S.cargosVotados[g.id]||[]).length;
      var status,cor;
      if(ativo){status='● Em votação';cor='#3B6D11';}
      else if(encerrado){status='✓ Encerrado ('+nVotos+' votos)';cor='#854F0B';}
      else if(nCand===0){status='Sem candidatos';cor='#aaa';}
      else{status='Aguardando';cor='#888';}
      return '<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f5f4ef">'
        +'<div><span style="font-size:13px;font-weight:600">'+esc(g.nome)+'</span>'
        +'<span style="font-size:11px;color:#aaa"> · '+nCand+' cand. · '+g.vagas+' vaga(s)</span></div>'
        +'<div style="display:flex;align-items:center;gap:8px">'
        +'<span style="font-size:12px;font-weight:600;color:'+cor+'">'+status+'</span>'
        +(encerrado?'<button class="btn btn-warn btn-sm" data-gid="'+g.id+'" onclick="elReiniciarCargoEl(this)" title="Refazer votação">🔄</button>':'')
        +'</div>'
        +'</div>';
    }).join('');
  }
  html+='</div>';

  // Lista de quem aguarda (durante votação ativa)
  if(S.elStatus==='ativa'&&S.cargoAtivo){
    var votadosC=S.cargosVotados[S.cargoAtivo]||[];
    var naoVotou=S.users.filter(function(u){return S.presentes.some(function(p){return p.id===u.id;})&&votadosC.indexOf(u.id)<0;});
    html+='<div class="card" style="margin-bottom:14px">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">'
        +'<p style="font-size:13px;font-weight:700">⏳ Aguardando ('+naoVotou.length+')</p>'
        +'<span style="font-size:11px;color:#aaa">atualiza a cada 2s</span></div>'
      +(naoVotou.length===0
        ?'<p style="text-align:center;color:#3B6D11;font-weight:700;font-size:15px;padding:10px">🎉 Todos votaram!</p>'
        :naoVotou.map(function(u){return '<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #f5f4ef"><div style="width:8px;height:8px;border-radius:50%;background:#fbbf24;flex-shrink:0"></div><p style="font-size:13px">'+esc(u.nome)+'</p></div>';}).join(''))
      +'</div>';
  }

  // Datashow + reiniciar tudo
  html+='<div class="card" style="margin-bottom:14px;background:var(--bg,#f0ede6)">'
    +'<p style="font-size:13px;font-weight:600;margin-bottom:6px">📺 Datashow</p>'
    +'<a class="btn btn-p" href="/datashow" target="_blank">Abrir datashow ↗</a></div>';
  if(S.cargosEncerrados.length>0||S.cargoAtivo){
    html+='<div class="card"><p style="font-size:12px;color:#888;margin-bottom:8px">Reiniciar apaga TODOS os votos de TODOS os cargos.</p>'
      +'<button class="btn btn-warn btn-full" onclick="elReiniciar()">🔄 Reiniciar eleição completa</button></div>';
  }
  return html;
}

async function elIniciar(){
  var cargoId=($('el-cargo')?$('el-cargo').value:'');
  if(!cargoId){toast('Selecione um cargo.','warn');return;}
  const r=await api.post('/api/eleicao/iniciar',{cargoId:cargoId});
  if(r.error){toast(r.error,'danger');return;}
  toast('Votação de '+(r.cargo||'cargo')+' iniciada!','success');
  await loadState();await renderTab();startPoll();
}
async function elEncerrar(){
  if(!confirm('Encerrar a votação deste cargo? O resultado será armazenado.'))return;
  const r=await api.post('/api/eleicao/encerrar',{});
  if(r.error){toast(r.error,'danger');return;}
  toast('Votação encerrada. Resultado armazenado.','info');
  stopPoll();await loadState();await renderTab();
}
function elReiniciarCargoEl(el){ var gid=el.getAttribute('data-gid'); if(gid) elReiniciarCargo(gid); }
async function elReiniciarCargo(cargoId){
  if(!confirm('Refazer a votação deste cargo? Os votos atuais dele serão apagados.'))return;
  const r=await api.post('/api/eleicao/reiniciar-cargo',{cargoId:cargoId});
  if(r.error){toast(r.error,'danger');return;}
  toast('Cargo reaberto para nova votação.','warn');
  await loadState();await renderTab();
}
async function elReiniciar(){
  if(!confirm('Reiniciar apaga TODOS os votos de TODOS os cargos. Confirmar?'))return;
  const r=await api.post('/api/eleicao/reiniciar',{});
  if(r.error){toast(r.error,'danger');return;}
  toast('Eleição reiniciada.','warn');
  stopPoll();await loadState();await renderTab();
}
function startPoll(){stopPoll();_pollTimer=setInterval(async()=>{if(S.tab==='eleicao'&&S.elStatus==='ativa'){await loadState();const el=$('tab-content');if(el)el.innerHTML=tabEleicao();}},2000);}
function stopPoll(){if(_pollTimer){clearInterval(_pollTimer);_pollTimer=null;}}

// ─── TAB: RESULTADOS ──────────────────────────────────────────────────────────
async function tabResultados(){
  if(!S.cargosEncerrados||S.cargosEncerrados.length===0)
    return '<div style="text-align:center;padding:48px"><div style="font-size:48px">🔒</div><p style="color:#888;margin-top:12px">Disponível após o encerramento da votação de pelo menos um cargo.</p></div>';
  const data=await api.get('/api/resultados');
  if(!data||!data.cargos)return '<p style="color:#888">Sem dados.</p>';
  const resultados=data.resultados,cargos=data.cargos,candidatos=data.candidatos,cargosVotados=data.cargosVotados||{};

  var html='<h3 style="font-weight:700;margin-bottom:14px">Resultados por Cargo</h3>'
    +'<div style="margin-bottom:14px"><button class="btn btn-p" onclick="exportarResultado()">📊 Exportar todos (.xlsx)</button></div>';

  // Mostra cada cargo encerrado
  data.cargosEncerrados.forEach(function(gid){
    var cargo=cargos.find(function(g){return g.id===gid;});
    if(!cargo)return;
    var res=resultados[gid]||{},branco=res.branco||0;
    var votantes=(cargosVotados[gid]||[]).length;
    var maioria=Math.ceil(votantes/2);
    var rank=Object.keys(res).filter(function(k){return k!=='branco';})
      .map(function(cid){var c=candidatos.find(function(x){return x.id===cid;});return c?{cid:cid,c:c,v:res[cid]}:null;})
      .filter(Boolean).sort(function(a,b){return b.v-a.v;});
    var eleitos=rank.filter(function(r,i){return i<cargo.vagas&&r.v>=maioria&&r.v>0;});

    html+='<div class="card" style="margin-bottom:14px">'
      +'<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">'
        +'<div><h3 style="font-weight:700;font-size:16px">'+esc(cargo.nome)+'</h3>'
        +'<p style="font-size:11px;color:#888">'+cargo.vagas+' vaga'+(cargo.vagas>1?'s':'')+' · '+votantes+' votaram · Maioria: '+maioria+' votos</p></div>'
        +'<span class="badge '+(eleitos.length>0?'bdg-ok':'bdg-err')+'">'+eleitos.length+' eleito'+(eleitos.length!==1?'s':'')+'</span>'
      +'</div><div class="divider"></div>';

    html+=rank.map(function(r,i){
      var pct=votantes>0?Math.round(r.v/votantes*100):0;
      var el=eleitos.some(function(e){return e.cid===r.cid;});
      return '<div style="margin-bottom:12px">'
        +'<div style="display:flex;align-items:center;gap:8px">'
          +'<span style="font-size:11px;color:#aaa;min-width:18px">#'+(i+1)+'</span>'
          +avHTML(r.c,30)
          +'<p style="font-size:13px;font-weight:'+(el?700:400)+';flex:1">'+esc(r.c.nome)+'</p>'
          +'<p style="font-size:13px;font-weight:700">'+r.v+'</p>'
          +'<p style="font-size:11px;color:#888;min-width:36px;text-align:right">'+pct+'%</p>'
          +(el?'<span class="badge bdg-ok">✓ Eleito</span>':(r.v>0?'<span class="badge bdg-warn">Insuf.</span>':''))
        +'</div>'
        +'<div style="height:7px;background:#eee;border-radius:4px;overflow:hidden;margin-top:5px">'
          +'<div style="height:100%;border-radius:4px;width:'+pct+'%;background:'+(el?'#3B6D11':'var(--p)')+';transition:width .6s"></div>'
        +'</div></div>';
    }).join('');

    if(branco>0){
      html+='<div style="margin-top:8px;padding:8px 12px;background:#f8f8f6;border-radius:8px;display:flex;align-items:center;gap:8px">'
        +'<div style="width:30px;height:30px;border-radius:50%;background:#eee;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0">⬜</div>'
        +'<p style="font-size:13px;color:#888;font-style:italic">Votos em branco / nulos: <strong>'+branco+'</strong></p></div>';
    }

    // Botão exportar individual
    html+='<div style="margin-top:12px"><button class="btn btn-sm" data-gid="'+gid+'" onclick="exportarCargoEl(this)">📊 Exportar '+esc(cargo.nome)+' (.xlsx)</button></div>';
    html+='</div>';
  });

  return html;
}
function exportarCargoEl(el){ var gid=el.getAttribute('data-gid'); if(gid) downloadFile('/api/resultados/cargo/'+gid+'/exportar-xlsx','resultado-cargo.xlsx'); }


// ─── TAB: CONFIGURAÇÕES ────────────────────────────────────────────────────────
function tabConfig(){
  const c=S.config||{};
  const cr=(id,label,val)=>`
    <div class="field" style="margin:0">
      <label>${label}</label>
      <div style="display:flex;gap:8px;align-items:center;margin-top:4px">
        <input type="color" id="${id}-p" value="${val}" style="width:38px;height:34px;border:1px solid #ccc;border-radius:6px;cursor:pointer;padding:2px">
        <input id="${id}-h" class="input" style="flex:1" value="${val}" placeholder="${val}">
      </div>
    </div>`;
  return`
  <h3 style="font-weight:700;margin-bottom:14px">⚙️ Configurações</h3>
  <div class="card" style="margin-bottom:14px">
    <p style="font-size:13px;font-weight:600;margin-bottom:12px">🏛️ Identidade</p>
    <div class="field"><label>Nome da Igreja / Instituição</label><input id="cfg-nome" class="input" value="${esc(c.nomeInstituicao||'')}"></div>
    <div class="field">
      <label>Logotipo</label>
      ${c.logoUrl?`<div style="margin-bottom:8px"><img src="${esc(c.logoUrl)}" style="max-height:60px;border-radius:8px"></div>`:''}
      <label class="btn btn-p btn-sm" style="cursor:pointer;width:fit-content">📷 Enviar logo<input type="file" accept="image/*" style="display:none" onchange="uploadLogo(this)"></label>
    </div>
  </div>
  <div class="card" style="margin-bottom:14px">
    <p style="font-size:13px;font-weight:600;margin-bottom:12px">🎨 Cores</p>
    <div class="grid2" style="gap:12px">
      ${cr('cp','Cor primária (botões)',c.corPrimaria||'#185FA5')}
      ${cr('cs','Cor secundária (sucesso)',c.corSecundaria||'#3B6D11')}
      ${cr('cbg','Fundo',c.corFundo||'#f0ede6')}
      ${cr('ctx','Texto',c.corTexto||'#1a1a18')}
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
      <button class="btn btn-p" onclick="salvarConfig()">💾 Salvar</button>
      <button class="btn" onclick="resetCores()">↺ Padrão</button>
    </div>
    <div id="cfg-msg" style="display:none;margin-top:10px"></div>
  </div>
  <div class="card">
    <p style="font-size:13px;font-weight:600;margin-bottom:12px">🔐 Alterar senha do admin</p>
    <div class="grid2" style="gap:10px">
      <div class="field" style="margin:0"><label>Senha atual</label><input id="pwd-atual" class="input" type="password" autocomplete="current-password"></div>
      <div class="field" style="margin:0"><label>Nova senha (mín. 6 caracteres)</label><input id="pwd-nova" class="input" type="password" autocomplete="new-password"></div>
    </div>
    <div id="pwd-err" class="err-box" style="display:none;margin-top:8px"></div>
    <button class="btn btn-p" style="margin-top:10px" onclick="salvarSenha()">Salvar nova senha</button>
  </div>`;
}
async function uploadLogo(input){const file=input.files[0];if(!file)return;toast('Enviando...','info');const r=await api.upload('/api/config/logo','logo',file);if(r.error){toast('Erro: '+r.error,'danger');return;}toast('Logo atualizado!','success');await loadState();await renderTab();}
async function salvarConfig(){
  const nome=($('cfg-nome').value||'').trim();
  const cp=($('cp-h').value||$('cp-p').value).trim(),cs=($('cs-h').value||$('cs-p').value).trim();
  const cbg=($('cbg-h').value||$('cbg-p').value).trim(),ctx=($('ctx-h').value||$('ctx-p').value).trim();
  const m=$('cfg-msg');
  const r=await api.post('/api/config',{nomeInstituicao:nome,corPrimaria:cp,corSecundaria:cs,corFundo:cbg,corTexto:ctx});
  if(r.error){m.className='err-box';m.textContent=r.error;m.style.display='block';return;}
  m.className='succ-box';m.textContent='✓ Salvo!';m.style.display='block';
  applyTheme(r.config);toast('Configurações salvas!','success');
  setTimeout(()=>renderTab(),500);
}
function resetCores(){[['cp','#185FA5'],['cs','#3B6D11'],['cbg','#f0ede6'],['ctx','#1a1a18']].forEach(([id,v])=>{const p=$(id+'-p'),h=$(id+'-h');if(p)p.value=v;if(h)h.value=v;});}
async function salvarSenha(){
  const atual=$('pwd-atual').value,nova=$('pwd-nova').value;
  const e=$('pwd-err');e.style.display='none';
  if(!atual||!nova){e.textContent='Preencha ambos os campos.';e.style.display='block';return;}
  const r=await api.post('/api/admin/senha',{senhaAtual:atual,novaSenha:nova});
  if(r.error){e.textContent=r.error;e.style.display='block';return;}
  toast('Senha alterada!','success');$('pwd-atual').value='';$('pwd-nova').value='';
}

// ─── Bind events ──────────────────────────────────────────────────────────────
function cpfInput(inputId,statusId){
  const inp=$(inputId),st=$(statusId);if(!inp)return;
  inp.addEventListener('input',e=>{
    e.target.value=fmtCPF(e.target.value);
    const v=e.target.value,ok=validCPF(v);
    inp.classList.toggle('cpf-ok',v.replace(/\D/g,'').length===11&&ok);
    inp.classList.toggle('cpf-err',v.replace(/\D/g,'').length===11&&!ok);
    if(st)st.textContent=v.replace(/\D/g,'').length===11?(ok?'✓ válido':'✗ inválido'):'';
  });
}
function bindTabEvents(){
  cpfInput('u-cpf','u-cpf-st');
  cpfInput('eu-cpf','eu-cpf-st');
  [['cp'],['cs'],['cbg'],['ctx']].forEach(([id])=>{
    const pick=$(id+'-p'),hex=$(id+'-h');
    if(!pick||!hex)return;
    pick.addEventListener('input',e=>hex.value=e.target.value);
    hex.addEventListener('input',e=>{if(/^#[0-9a-fA-F]{6}$/.test(e.target.value))pick.value=e.target.value;});
  });
}
</script>
